# Cornix + nRF52840 nice!nano-compatible OLED dongle. No Corne targets.
include:
  - board: nice_nano//zmk
    shield: cornix_dongle_adapter cornix_dongle_eyelash dongle_display
    cmake-args: -DCONFIG_ZMK_DISPLAY=y -DCONFIG_ZMK_DONGLE_DISPLAY_BONGO_CAT=y
    artifact-name: cornix_dongle_oled
  - board: cornix_ph_left//zmk
    artifact-name: cornix_left_for_dongle
  - board: cornix_right//zmk
    artifact-name: cornix_right_for_dongle
  - board: cornix_right//zmk
    shield: settings_reset
    snippet: nrf52840-nosd
    artifact-name: cornix_halves_settings_reset
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: dongle_nicenano_settings_reset
  # Optional fallback: conventional left-central Cornix (requires re-pairing).
  - board: cornix_left//zmk
    artifact-name: cornix_left_standalone
